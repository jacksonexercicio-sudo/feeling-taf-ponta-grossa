<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#020617">
  <meta name="robots" content="noindex,follow">
  <meta name="description" content="Acesse o e-book oficial TAFEXATO de 45 páginas em PDF.">
  <meta http-equiv="refresh" content="0;url=https://drive.google.com/file/d/1gujelkpcmwOLTLPI2KXs6lATUGaYvOZD/view?usp=sharing">
  <title>Seu e-book oficial TAFEXATO (PDF)</title>
  <style>
    :root{color-scheme:light;--taf-indigo:#4F39F6;--taf-dark:#020617}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;min-height:100dvh;background:#f8fafc;color:var(--taf-dark);font:16px/1.55 Arial,Helvetica,sans-serif;display:flex;flex-direction:column}
    header{background:var(--taf-dark);padding:22px 24px}
    header img{width:210px;max-width:80vw;height:auto}
    main{width:min(94%,650px);margin:auto;text-align:center;padding:35px 25px;background:#fff;border:1px solid #e2e8f0;border-radius:18px}
    h1{font-size:clamp(24px,4vw,38px);line-height:1.15;margin:8px 0 15px}
    p{margin:0 0 20px;color:#334155}
    .btn{display:inline-block;padding:14px 21px;border-radius:10px;background:var(--taf-indigo);color:#fff;font-weight:700;text-decoration:none;max-width:100%}
    .btn:focus-visible,a:focus-visible{outline:3px solid var(--taf-indigo);outline-offset:4px}
    .alt{display:block;margin:19px auto 0;color:var(--taf-indigo)}
    footer{text-align:center;color:#475569;font-size:13px;padding:20px}
  </style>
  <script>window.location.replace("https://drive.google.com/file/d/1gujelkpcmwOLTLPI2KXs6lATUGaYvOZD/view?usp=sharing");</script>
</head>
<body>
  <header><img src="assets/logo-tafexato-escuro.svg" alt="TAFEXATO" onerror="this.src='assets/logo-tafexato-claro.svg'"></header>
  <main>
    <h1>Seu e-book oficial TAFEXATO está pronto!</h1>
    <p>Você será direcionado ao PDF completo, com 45 páginas, para ler ou baixar.</p>
    <a class="btn" href="https://drive.google.com/file/d/1gujelkpcmwOLTLPI2KXs6lATUGaYvOZD/view?usp=sharing">ABRIR E-BOOK OFICIAL (PDF)</a>
    <a class="alt" href="https://tafexato.com.br/">Voltar à TAFEXATO</a>
  </main>
  <footer>TAFEXATO — preparação física para concursos</footer>
</body>
</html>
